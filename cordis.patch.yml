# dsh-remote-tunnel bundle patch: one row inserted over the composed profile.
#
# The row owns the command line ONLY on profiles where the web app does not.
# The mode is chosen at apply time from `profileContext.name` (web/desktop ⇒
# service mode), which the profile boot provides before any row mounts; the
# web app's `webStartup` service is only a fallback, because rows initialise
# concurrently and a wrong guess would let this row call appExit() on the host.
# On web/desktop it stays in service mode and registers `/remote` commands.
#
# Install on a dedicated CLI profile:
#   dsh plugin --profile remote add dsh-remote-tunnel
#   dsh --profile remote up <host>
# or on the web profile for the `/remote ...` commands.

- insert:
    - id: remote-tunnel
      name: 'dsh-remote-tunnel'
      inject: [cmdlineArgs]
      # Every field the Config schema declares is spelled out here: a profile
      # patch can only override keys the row already carries, so the defaults
      # have to exist in the row itself for 设置 → 插件 to be able to change them.
      config:
        home: !!js dshHomePath('remote-tunnel')
        openIn: ask
        autoOpen: false
        dock: true
