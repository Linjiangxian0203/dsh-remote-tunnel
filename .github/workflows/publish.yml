name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release-notes step edits/creates the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'   # matches package.json engines (>=22.19)
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci   # reproducible install from the committed package-lock.json

      - name: Test
        run: node --test test/unit.test.js test/integration.test.js

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach bilingual release notes (.github/releases/<tag>.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::warning::missing $NOTES — write bilingual notes before tagging"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES" \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "dsh $GITHUB_REF_NAME" --notes-file "$NOTES"
